name: publish
# When a release is published or called manually
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - release-[0-9]+.[0-9]+

concurrency:
  group: publish-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  # It's not safe to cancel the publish
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash
env:
  CI: "true"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  NEXTEST_PROFILE: "ci"
  MAIN_CRATE: "@MAIN_CRATE@"
  EXPORT_FOR_CI: "true"

jobs:
  # Release unpublished packages.
  release-plz-release:
    name: release-plz-release
    runs-on: ubuntu-26.04
    if: github.repository_owner == '@REPOSITORY_OWNER@'
    permissions:
      contents: write # Needed to push to the release PR branch, tag and release
      id-token: write # Needed to authenticate with crates.io
      pull-requests: read # Needed to read the release PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: $/.github/actions/install-deps
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Run release-plz
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    name: release-plz-pr
    runs-on: ubuntu-26.04
    if: github.repository_owner == '@REPOSITORY_OWNER@'
    permissions:
      contents: write # Needed to push to the release PR branch, tag and release
      pull-requests: write # Needed to read the release PRs
      id-token: write # Needed to authenticate with crates.io
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: $/.github/actions/install-deps
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Run release-plz
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
