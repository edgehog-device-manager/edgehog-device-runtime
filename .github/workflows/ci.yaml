name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - main
      - release-[0-9]+.[0-9]+
permissions:
  contents: read
  id-token: write
env:
  CI: "true"
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  NEXTEST_PROFILE: "ci"
  MAIN_CRATE: "@MAIN_CRATE@"
  EXPORT_FOR_CI: "true"
# Spend CI time only on latest ref
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  dco:
    uses: ./.github/workflows/dco.yaml
    permissions:
      checks: read
      contents: read
      actions: read
      pull-requests: read
    with:
      pr: ${{ github.event.pull_request.number }}
  common:
    uses: ./.github/workflows/common.yaml
  e2e-test:
    uses: ./.github/workflows/e2e-test.yaml
  multi-platform:
    uses: ./.github/workflows/multi-platform.yaml
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: homebrew-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: homebrew-rubygems-
      - name: install brew bundle
        run: |
          brew bundle install
      - uses: ./.github/actions/install-deps
      - uses: go-task/setup-task@v2.2.0
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: taiki-e/install-action@v2.87.26
        with:
          tool: |
            cargo-docs-rs
            cargo-minimal-versions
            cargo-semver-checks
            rustfilt
      - run: |
          task ci
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
