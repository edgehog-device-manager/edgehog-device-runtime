name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - main
      - release-[0-9]+.[0-9]+

# Spend CI time only on latest ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  NEXTEST_PROFILE: "ci"
  MAIN_CRATE: "@MAIN_CRATE@"
  EXPORT_FOR_CI: "true"

jobs:
  dco:
    uses: $/.github/workflows/dco.yaml
    permissions:
      contents: read # clones the repo
      actions: read # checks the action rollup
      checks: read # checks the action rollup
      pull-requests: read # checks the action rollup
    with:
      pr: ${{ github.event.pull_request.number }}

  common:
    uses: $/.github/workflows/common.yaml

  e2e-test:
    uses: $/.github/workflows/e2e-test.yaml

  multi-platform:
    uses: $/.github/workflows/multi-platform.yaml

  check:
    name: check
    runs-on: ubuntu-26.04
    permissions:
      contents: read # clones the repository
      id-token: write # authenticates with codecov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: install rust toolchain
        # zizmor: ignore[cache-poisoning] we release and publish in another job without cache
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true
      - parallel:
          - name: Cache Homebrew prefix from Brewfile
            uses: Homebrew/actions/cache-homebrew-prefix@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
            with:
              brewfile: true
          - uses: $/.github/actions/install-deps
          - name: install sccache
            # zizmor: ignore[cache-poisoning] we release and publish in another job without cache
            uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
          - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
            with:
              tool: |
                cargo-docs-rs
                cargo-minimal-versions
                cargo-semver-checks
                rustfilt
      - run: |
          task ci
      - name: Upload to codecov.io
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
