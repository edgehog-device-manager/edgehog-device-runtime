name: common
on:
  workflow_call:
  workflow_dispatch:

# Spend CI time only on latest ref
concurrency:
  group: common-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CLICOLOR: 1

jobs:
  check-copyright:
    name: check-copyright
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: |
          uv tool install reuse
          ./scripts/ci/add-copyright-to-modified.sh "$BASE_REF" "$HEAD_REF"
          git diff --exit-code --name-only

  conventional-commit:
    name: conventional-commit
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: crate-ci/committed@faeed42f2e10c244533a01525f13c4d8b6ce383f # v1.1.11
        with:
          args: "-vv"
